# Production stack. On the server:
#   cp .env.production.example .env    # then fill in the values
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from docker-compose.yml (development): HTTPS through Caddy, code
# baked into the image, no internal port published, secrets from .env, and
# every container restarts on its own after a crash or a reboot.

name: kmzinho

services:
  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      API_HOST: ${API_HOST:?Set API_HOST in .env}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here: losing this volume means asking Let's Encrypt again.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      APP_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      OSRM_URL: http://osrm:5000
    volumes:
      - logs:/var/www/html/storage/logs
      - cnefe-data:/var/www/html/data
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:?Set DB_ROOT_PASS in .env}
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in .env}
      MYSQL_USER: ${DB_USER:?Set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASS:?Set DB_PASS in .env}
    # No published port: only the api container talks to the database.
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  osrm:
    # Keep in sync with map-build: OSRM only reads files built by its own version.
    image: ghcr.io/project-osrm/osrm-backend:v26.4.0
    restart: unless-stopped
    command: osrm-routed --algorithm mld /data/${OSRM_MAP_NAME:-limeira}.osrm
    volumes:
      - ./osrm-data:/data

  # Map pipeline, run on demand (same as in development):
  #   docker compose -f docker-compose.prod.yml run --rm map-clip
  #   docker compose -f docker-compose.prod.yml run --rm map-build
  #   docker compose -f docker-compose.prod.yml restart osrm
  map-clip:
    build: ./docker/osrm/clip
    profiles: ["tools"]
    volumes:
      - ./osrm-data:/data
    environment:
      OSRM_MAP_NAME: ${OSRM_MAP_NAME:-limeira}

  map-build:
    image: ghcr.io/project-osrm/osrm-backend:v26.4.0
    profiles: ["tools"]
    entrypoint: ["sh", "/scripts/build-routing.sh"]
    volumes:
      - ./osrm-data:/data
      - ./docker/osrm/build-routing.sh:/scripts/build-routing.sh:ro
    environment:
      OSRM_MAP_NAME: ${OSRM_MAP_NAME:-limeira}

volumes:
  caddy-data:
  caddy-config:
  mysql-data:
  logs:
  cnefe-data:
