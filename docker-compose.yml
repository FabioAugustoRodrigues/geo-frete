services:
  api:
    build: ./docker/php
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      # Override the host-oriented values from .env: inside the Compose
      # network services are reached by name on their internal ports.
      DB_HOST: mysql
      DB_PORT: 3306
      OSRM_URL: http://osrm:5000
    depends_on:
      mysql:
        condition: service_healthy
      # No dependency on osrm: without it the API keeps answering with
      # straight-line estimates.

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: geo_frete
      MYSQL_USER: geo_frete
      MYSQL_PASSWORD: geo_frete
    ports:
      # 3307 on the host avoids clashing with a local MySQL (e.g. XAMPP) on 3306.
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docker/mysql/02-test-database.sql:/docker-entrypoint-initdb.d/02-test-database.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  osrm:
    # Keep in sync with map-build: OSRM only reads files built by its own version.
    image: ghcr.io/project-osrm/osrm-backend:v26.4.0
    # Needs the files built by map-clip + map-build; exits until they exist.
    command: osrm-routed --algorithm mld /data/${OSRM_MAP_NAME:-limeira}.osrm
    ports:
      # Published on localhost only, for php -S on the host and for study.
      - "127.0.0.1:5000:5000"
    volumes:
      - ./osrm-data:/data

  # Map pipeline, run on demand (profile "tools" keeps them out of `up`):
  #   docker compose run --rm map-clip    # download region + clip the city
  #   docker compose run --rm map-build   # OSRM preprocessing
  #   docker compose restart osrm
  map-clip:
    build: ./docker/osrm/clip
    profiles: ["tools"]
    volumes:
      - ./osrm-data:/data
    environment:
      OSRM_MAP_NAME: ${OSRM_MAP_NAME:-limeira}

  map-build:
    image: ghcr.io/project-osrm/osrm-backend:v26.4.0
    profiles: ["tools"]
    entrypoint: ["sh", "/scripts/build-routing.sh"]
    volumes:
      - ./osrm-data:/data
      - ./docker/osrm/build-routing.sh:/scripts/build-routing.sh:ro
    environment:
      OSRM_MAP_NAME: ${OSRM_MAP_NAME:-limeira}

volumes:
  mysql-data:
