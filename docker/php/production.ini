; Loaded after php.ini-production (see docker/php/Dockerfile.prod).

; Do not announce the PHP version in an X-Powered-By header.
expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
; The code is baked into the production image and never changes at runtime:
; skip checking files for changes on every request.
opcache.validate_timestamps = 0
