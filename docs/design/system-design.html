<!DOCTYPE html>
<!--
  Source of docs/images/system-design.png. To regenerate after editing,
  see docs/design/README.md.
-->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>kmzinho · system design</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=block" rel="stylesheet">
    <style>
        * { margin: 0; }
        html, body { width: 1600px; height: 1000px; background: #F3F7F4; }
        svg { display: block; }

        .title { font: 800 34px Inter, sans-serif; fill: #0F1A14; letter-spacing: -0.03em; }
        .title .km { fill: #009C3B; }
        .subtitle { font: 400 17px Inter, sans-serif; fill: #5B6B63; }

        .zone { font: 600 13px "JetBrains Mono", monospace; letter-spacing: 0.1em; fill: #5B6B63; }
        .band { font: 600 11.5px "JetBrains Mono", monospace; letter-spacing: 0.1em; fill: #8A9A92; }
        .name { font: 600 15px "JetBrains Mono", monospace; fill: #0F1A14; }
        .name.small { font-size: 13px; }
        .human { font: 600 16px Inter, sans-serif; fill: #0F1A14; }
        .desc { font: 400 12.5px Inter, sans-serif; fill: #5B6B63; }
        .arrow-label { font: 600 12px Inter, sans-serif; fill: #0F1A14; }
        .badge { font: 800 12px Inter, sans-serif; fill: #FFFFFF; }
        .step { font: 400 14px Inter, sans-serif; fill: #0F1A14; }
        .step tspan.b { font-weight: 600; }
        .table { font: 400 13px "JetBrains Mono", monospace; fill: #0F1A14; }
        .table-note { font: 400 12px Inter, sans-serif; fill: #5B6B63; }

        .box { fill: #FFFFFF; stroke: #DCE5DF; stroke-width: 1.5; }
        .box.key { stroke: #009C3B; stroke-width: 2; }
        .group { fill: #F7FAF8; stroke: #DCE5DF; stroke-width: 1.5; stroke-dasharray: 0; }
        .container { fill: #FFFFFF; stroke: #009C3B; stroke-width: 2; }
        .container-fill { fill: #FBFDFC; stroke: #009C3B; stroke-width: 2; }
        .internet { fill: none; stroke: #8A9A92; stroke-width: 1.5; stroke-dasharray: 6 5; }
        .tag { fill: #E3F2EA; }
        .tag-text { font: 600 11px "JetBrains Mono", monospace; fill: #00752C; }

        .flow { fill: none; stroke: #0F1A14; stroke-width: 2; }
        .offline { fill: none; stroke: #8A9A92; stroke-width: 2; stroke-dasharray: 7 5; }
    </style>
</head>

<body>
<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="#0F1A14"/>
        </marker>
        <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="#8A9A92"/>
        </marker>
        <g id="docker">
            <rect class="tag" width="62" height="20" rx="10"/>
            <text class="tag-text" x="31" y="14" text-anchor="middle">docker</text>
        </g>
    </defs>

    <!-- Title ---------------------------------------------------------- -->
    <text x="48" y="70" class="title"><tspan class="km">km</tspan>zinho<tspan fill="#5B6B63" font-weight="400"> · system design</tspan></text>
    <text x="48" y="102" class="subtitle">How a distance request flows through the system, and how the data gets there.</text>

    <!-- Left column: consumer ------------------------------------------ -->
    <rect class="box" x="48" y="196" width="212" height="96" rx="14"/>
    <text class="human" x="68" y="228">Consumer system</text>
    <text class="desc" x="68" y="250">store, delivery app, ERP</text>
    <text class="desc" x="68" y="270">sends addresses, gets km</text>

    <!-- Left column: Caddy (production HTTPS entry point) ---------------- -->
    <path class="flow" d="M154 294 L154 362" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text class="arrow-label" x="166" y="333">HTTPS · JSON</text>

    <rect class="container" x="48" y="364" width="212" height="92" rx="14"/>
    <text class="name" x="68" y="394">caddy</text>
    <use href="#docker" x="182" y="379"/>
    <text class="desc" x="68" y="416">HTTPS · Let's Encrypt</text>
    <text class="desc" x="68" y="436">production only</text>

    <path class="flow" d="M262 410 L314 410" marker-end="url(#arrow)"/>
    <text class="arrow-label" x="288" y="400" text-anchor="middle">HTTP</text>

    <!-- Left column: internet ------------------------------------------ -->
    <rect class="internet" x="48" y="560" width="232" height="370" rx="14"/>
    <text class="zone" x="68" y="590">INTERNET</text>

    <rect class="box" x="64" y="602" width="200" height="62" rx="10"/>
    <text class="human" x="80" y="628">Nominatim</text>
    <text class="desc" x="80" y="648">OpenStreetMap geocoding</text>

    <rect class="box" x="64" y="748" width="200" height="64" rx="10"/>
    <text class="human" x="80" y="774">IBGE</text>
    <text class="desc" x="80" y="794">CNEFE 2022 · localities API</text>

    <rect class="box" x="64" y="850" width="200" height="64" rx="10"/>
    <text class="human" x="80" y="876">Geofabrik</text>
    <text class="desc" x="80" y="896">OpenStreetMap extracts</text>

    <!-- API container -------------------------------------------------- -->
    <rect class="container-fill" x="316" y="140" width="794" height="790" rx="18"/>
    <text class="zone" x="338" y="170">API · PHP 8.2 + APACHE · iMono</text>
    <use href="#docker" x="1028" y="156"/>

    <!-- HTTP band -->
    <text class="band" x="340" y="202">HTTP</text>
    <rect class="box" x="340" y="210" width="366" height="62" rx="10"/>
    <circle cx="362" cy="241" r="12" fill="#009C3B"/><text class="badge" x="362" y="245.5" text-anchor="middle">1</text>
    <text class="name" x="384" y="236">ApiKey → RateLimit</text>
    <text class="desc" x="384" y="256">middlewares · 401 / 429</text>

    <rect class="box" x="720" y="210" width="366" height="62" rx="10"/>
    <text class="name" x="740" y="236">Distance · Streets · Cities · Health</text>
    <text class="desc" x="740" y="256">controllers: HTTP ↔ domain, nothing else</text>

    <!-- Services band -->
    <text class="band" x="340" y="302">SERVICES</text>
    <rect class="box" x="340" y="310" width="240" height="62" rx="10"/>
    <circle cx="362" cy="341" r="12" fill="#009C3B"/><text class="badge" x="362" y="345.5" text-anchor="middle">2</text>
    <text class="name small" x="384" y="336">RequestValidator</text>
    <text class="desc" x="384" y="356">400 lists every error</text>

    <rect class="box key" x="594" y="310" width="492" height="62" rx="10"/>
    <text class="name" x="614" y="336">DistanceCalculationService</text>
    <text class="desc" x="614" y="356">orchestrator: resolve origin, resolve destination, then route</text>

    <rect class="box key" x="340" y="386" width="366" height="62" rx="10"/>
    <text class="name" x="360" y="412">AddressResolverService</text>
    <text class="desc" x="360" y="432">client lat/lng → CNEFE → cache → Nominatim</text>

    <rect class="box" x="720" y="386" width="366" height="62" rx="10"/>
    <circle cx="742" cy="417" r="12" fill="#009C3B"/><text class="badge" x="742" y="421.5" text-anchor="middle">3</text>
    <text class="name" x="764" y="412">StreetMatcherService</text>
    <text class="desc" x="764" y="432">typo fix · ambiguity (422) · autocomplete</text>

    <!-- Geo band -->
    <text class="band" x="340" y="482">GEO · BEHIND INTERFACES, FAKES IN TESTS</text>
    <rect class="group" x="340" y="490" width="366" height="188" rx="12"/>
    <text class="name small" x="356" y="512" fill="#5B6B63">GeocoderInterface</text>
    <rect class="box" x="356" y="522" width="334" height="62" rx="10"/>
    <circle cx="378" cy="553" r="12" fill="#009C3B"/><text class="badge" x="378" y="557.5" text-anchor="middle">4</text>
    <text class="name" x="400" y="548">CnefeGeocoder</text>
    <text class="desc" x="400" y="568">local · exact, interpolated or street</text>

    <rect class="box" x="356" y="600" width="334" height="64" rx="10"/>
    <circle cx="378" cy="632" r="12" fill="#009C3B"/><text class="badge" x="378" y="636.5" text-anchor="middle">5</text>
    <text class="name" x="400" y="627">NominatimGeocoder</text>
    <text class="desc" x="400" y="647">remote fallback · cached · 1 req/s</text>

    <rect class="group" x="720" y="490" width="366" height="188" rx="12"/>
    <text class="name small" x="736" y="512" fill="#5B6B63">RoutingEngineInterface</text>
    <rect class="box" x="736" y="522" width="334" height="62" rx="10"/>
    <circle cx="758" cy="553" r="12" fill="#009C3B"/><text class="badge" x="758" y="557.5" text-anchor="middle">6</text>
    <text class="name" x="780" y="548">RoutingEngineWithFallback</text>
    <text class="desc" x="780" y="568">tries OSRM, falls back to the estimate</text>

    <rect class="box" x="736" y="600" width="160" height="64" rx="10"/>
    <text class="name small" x="750" y="627">Estimate</text>
    <text class="desc" x="750" y="647">straight line × 1.3</text>

    <rect class="box" x="910" y="600" width="160" height="64" rx="10"/>
    <text class="name small" x="924" y="627">OsrmRouting</text>
    <text class="desc" x="924" y="647">real road route</text>

    <!-- Repositories band -->
    <text class="band" x="340" y="708">REPOSITORIES · PDO</text>
    <rect class="box" x="340" y="716" width="176" height="58" rx="10"/>
    <text class="name small" x="354" y="750">Cnefe</text>
    <rect class="box" x="530" y="716" width="176" height="58" rx="10"/>
    <text class="name small" x="544" y="750">GeocodingCache</text>
    <rect class="box" x="720" y="716" width="176" height="58" rx="10"/>
    <text class="name small" x="734" y="750">RateLimit</text>
    <rect class="box" x="910" y="716" width="176" height="58" rx="10"/>
    <text class="name small" x="924" y="750">Throttle</text>

    <!-- CLI band -->
    <text class="band" x="340" y="814">CLI · OFFLINE</text>
    <rect class="box" x="340" y="822" width="366" height="66" rx="10"/>
    <text class="name" x="360" y="849">bin/import-cnefe.php</text>
    <text class="desc" x="360" y="869">downloads a city, fills the CNEFE tables</text>
    <rect class="box" x="720" y="822" width="366" height="66" rx="10"/>
    <text class="name" x="740" y="849">bin/compare-distances.php</text>
    <text class="desc" x="740" y="869">route-factor study (route vs. × 1.3)</text>

    <!-- Right column: request flow legend ------------------------------ -->
    <rect class="box" x="1150" y="140" width="402" height="262" rx="14"/>
    <text class="zone" x="1172" y="170">REQUEST FLOW</text>
    <g class="step">
        <circle cx="1184" cy="196" r="11" fill="#009C3B"/><text class="badge" x="1184" y="200.5" text-anchor="middle">1</text>
        <text x="1206" y="201"><tspan class="b">Authenticate</tspan> and count the request</text>
        <circle cx="1184" cy="226" r="11" fill="#009C3B"/><text class="badge" x="1184" y="230.5" text-anchor="middle">2</text>
        <text x="1206" y="231"><tspan class="b">Validate</tspan> both addresses</text>
        <circle cx="1184" cy="256" r="11" fill="#009C3B"/><text class="badge" x="1184" y="260.5" text-anchor="middle">3</text>
        <text x="1206" y="261"><tspan class="b">Correct</tspan> the street name</text>
        <circle cx="1184" cy="286" r="11" fill="#009C3B"/><text class="badge" x="1184" y="290.5" text-anchor="middle">4</text>
        <text x="1206" y="291"><tspan class="b">Locate</tspan> the house number in CNEFE</text>
        <circle cx="1184" cy="316" r="11" fill="#009C3B"/><text class="badge" x="1184" y="320.5" text-anchor="middle">5</text>
        <text x="1206" y="321">Not precise? <tspan class="b">cache, then Nominatim</tspan></text>
        <circle cx="1184" cy="346" r="11" fill="#009C3B"/><text class="badge" x="1184" y="350.5" text-anchor="middle">6</text>
        <text x="1206" y="351"><tspan class="b">Route</tspan> on OSRM (or estimate)</text>
        <text x="1172" y="384" class="desc">Solid arrows: per request · dashed: offline setup</text>
    </g>

    <!-- Right column: map pipeline ------------------------------------- -->
    <rect class="box" x="1150" y="426" width="402" height="92" rx="14"/>
    <text class="zone" x="1172" y="454">MAP PIPELINE</text>
    <use href="#docker" x="1470" y="440"/>
    <text class="name" x="1172" y="482">map-clip → map-build</text>
    <text class="desc" x="1172" y="502">clip Limeira out of the region · preprocess (~20 s)</text>

    <!-- Right column: OSRM ---------------------------------------------- -->
    <rect class="container" x="1150" y="566" width="402" height="112" rx="14"/>
    <text class="zone" x="1172" y="594">OSRM v26.4</text>
    <use href="#docker" x="1470" y="580"/>
    <text class="name" x="1172" y="622">osrm-routed --algorithm mld</text>
    <text class="desc" x="1172" y="644">serves limeira.osrm · routes in milliseconds</text>
    <text class="desc" x="1172" y="662">port 5000, internal network</text>

    <!-- Right column: MySQL --------------------------------------------- -->
    <rect class="container" x="1150" y="704" width="402" height="226" rx="14"/>
    <text class="zone" x="1172" y="732">MYSQL 8.4</text>
    <use href="#docker" x="1470" y="718"/>
    <text class="table" x="1172" y="758">cnefe_cities</text>
    <text class="table-note" x="1340" y="758">imported by hand</text>
    <text class="table" x="1172" y="778">cnefe_city_bounds</text>
    <text class="table" x="1172" y="798">cnefe_streets</text>
    <text class="table-note" x="1340" y="798">3,013 in Limeira</text>
    <text class="table" x="1172" y="818">cnefe_addresses</text>
    <text class="table-note" x="1340" y="818">92,588 house numbers</text>
    <text class="table" x="1172" y="838">geocoding_cache</text>
    <text class="table-note" x="1340" y="838">Nominatim answers</text>
    <text class="table" x="1172" y="858">rate_limit</text>
    <text class="table" x="1172" y="878">provider_throttle</text>
    <text class="desc" x="1172" y="910">Technical data only: no business tables.</text>

    <!-- Arrows ------------------------------------------------------------ -->
    <!-- Nominatim geocoder -> Nominatim -->
    <path class="flow" d="M356 632 L266 632" marker-end="url(#arrow)"/>
    <text class="arrow-label" x="290" y="622" text-anchor="middle">HTTPS</text>

    <!-- OSRM engine -> OSRM container -->
    <path class="flow" d="M1070 632 L1148 632" marker-end="url(#arrow)"/>
    <text class="arrow-label" x="1130" y="622" text-anchor="middle">HTTP</text>

    <!-- Repositories -> MySQL -->
    <path class="flow" d="M1086 745 L1148 745" marker-end="url(#arrow)"/>
    <text class="arrow-label" x="1130" y="735" text-anchor="middle">SQL</text>

    <!-- Import CLI -> IBGE (offline) -->
    <path class="offline" d="M340 855 L300 855 L300 780 L266 780" marker-end="url(#arrow-grey)"/>

    <!-- Geofabrik -> map pipeline (offline) -->
    <path class="offline" d="M164 914 L164 968 L1578 968 L1578 472 L1554 472" marker-end="url(#arrow-grey)"/>
    <text class="arrow-label" x="870" y="960" text-anchor="middle" fill="#5B6B63">region extract (~860 MB, once)</text>

    <!-- Map pipeline -> OSRM (offline) -->
    <path class="offline" d="M1351 518 L1351 564" marker-end="url(#arrow-grey)"/>
</svg>
</body>

</html>
